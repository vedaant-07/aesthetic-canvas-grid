name: Website Platform Quality Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/platform-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Repair lock and install dependencies
        run: npm install --no-fund --no-audit

      - name: Export repaired package lock
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint connected platform files
        run: npx eslint src/lib/platformApi.ts src/pages/gym-owner/OwnerWorkspace.tsx src/pages/GymLogin.tsx

      - name: Build production website
        run: npm run build
